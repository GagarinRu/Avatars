apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "avatars.fullname" . }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "avatars.fullname" . }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "avatars.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "avatars.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "avatars.fullname" . }}
