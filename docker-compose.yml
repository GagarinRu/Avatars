services:
  avatars_db:
    container_name: avatars.db
    hostname: avatars.db
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - avatars_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    container_name: avatars.rabbitmq
    hostname: avatars.rabbitmq
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    container_name: avatars.minio
    hostname: avatars.minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - avatars_minio_data:/data

  minio_init:
    build:
      context: ./scripts/minio-init
    container_name: avatars.minio_init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: avatars.migrate
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      avatars_db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    container_name: avatars.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADDRESS: ${ADDRESS:-:8080}
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_DOCKER_HOST}:5672/
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      OTEL_SERVICE_NAME: avatars-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      avatars_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    container_name: avatars.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_DOCKER_HOST}:5672/
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT}
      OTEL_SERVICE_NAME: avatars-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development
    ports:
      - "9091:9091"
    depends_on:
      avatars_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    container_name: avatars.otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "13133:13133"
    depends_on:
      - jaeger
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: avatars.jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:3.6.3
    container_name: avatars.loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - avatars_loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: avatars.prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
      - api
      - worker

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: avatars.alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:12.3.1
    container_name: avatars.grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - avatars_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
      - alertmanager

volumes:
  avatars_postgres_data:
  avatars_minio_data:
  avatars_loki_data:
  avatars_grafana_data:
