services:
  avatars_db:
    container_name: avatars.db
    hostname: avatars.db
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - avatars_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    container_name: avatars.rabbitmq
    hostname: avatars.rabbitmq
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    container_name: avatars.minio
    hostname: avatars.minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - avatars_minio_data:/data

  minio_init:
    build:
      context: ./scripts/minio-init
    container_name: avatars.minio_init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started

  api:
    build:
      context: .
      target: api
    container_name: avatars.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADDRESS: ${ADDRESS:-:8080}
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_DOCKER_HOST}:5672/
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      avatars_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    container_name: avatars.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_DOCKER_HOST}:5672/
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT}
    depends_on:
      avatars_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully

volumes:
  avatars_postgres_data:
  avatars_minio_data:
